<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Pengelola CBT - SMAN 1 Tebing Tinggi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-16 h-16 bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 rounded-2xl mx-auto flex items-center justify-center text-2xl font-bold shadow-inner">
                <i class="fa-solid fa-user-tie"></i>
            </div>
            <h1 class="text-xl font-bold text-white">Login Pengelola CBT</h1>
            <p class="text-xs text-slate-400">Admin & Guru SMAN 1 Tebing Tinggi</p>
        </div>

        <form id="form-login-admin" onsubmit="prosesLoginAdmin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Email Pengguna</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" id="email" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-sm text-white outline-none focus:border-emerald-500 font-semibold" placeholder="contoh: admin@sman1tt.com" required>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-11 py-3 text-sm text-white outline-none focus:border-emerald-500 font-semibold" placeholder="Masukkan password" required>
                    <button type="button" onclick="togglePasswordVisibility('password', 'icon-mata-admin')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-emerald-400 transition-colors cursor-pointer" title="Tampilkan / Sembunyikan Password">
                        <i id="icon-mata-admin" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="btn-login" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition-colors shadow-lg text-sm flex items-center justify-center space-x-2 mt-4 cursor-pointer">
                <span>Masuk Panel Pengelola</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>

    <!-- SCRIPT SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script>
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (!input || !icon) return;

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Jika sudah login, langsung arahkan ke dashboard
        if (localStorage.getItem('userLogin')) {
            const existingUser = JSON.parse(localStorage.getItem('userLogin'));
            window.location.href = existingUser.role === 'guru' ? "dashboard_guru.html" : "dashboard.html";
        }

        async function prosesLoginAdmin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const emailInput = document.getElementById('email').value.trim();
            const passInput = document.getElementById('password').value.trim();

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Memeriksa...';
            btn.disabled = true;

            const { data, error } = await db.from('users')
                .select('id, email, nama_lengkap, role')
                .eq('email', emailInput)
                .eq('password', passInput)
                .single();

            if (error || !data) {
                alert("Email atau Password salah!");
                btn.innerHTML = '<span>Masuk Panel Pengelola</span><i class="fa-solid fa-arrow-right"></i>';
                btn.disabled = false;
                return;
            }

            const payloadLogin = {
                id: data.id,
                email: data.email,
                nama_lengkap: data.nama_lengkap,
                role: data.role
            };

            localStorage.setItem('userLogin', JSON.stringify(payloadLogin));
            
            alert(`Selamat datang, ${data.nama_lengkap}!`);
            window.location.href = data.role === 'guru' ? "dashboard_guru.html" : "dashboard.html";
        }
    </script>
</body>
</html>
